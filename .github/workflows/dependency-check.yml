name: Dependency Check

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on the 1st day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check outdated packages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            // Function to get latest version from PyPI
            function getLatestVersion(packageName) {
              return new Promise((resolve, reject) => {
                const url = `https://pypi.org/pypi/${packageName}/json`;
                https.get(url, (res) => {
                  let data = '';
                  res.on('data', (chunk) => data += chunk);
                  res.on('end', () => {
                    try {
                      const json = JSON.parse(data);
                      resolve(json.info.version);
                    } catch (e) {
                      reject(e);
                    }
                  });
                }).on('error', reject);
              });
            }
            
            // Parse requirements.txt
            const requirements = fs.readFileSync('requirements.txt', 'utf8').split('\n').filter(line => line.trim() && !line.startsWith('#'));
            const deps = {};
            requirements.forEach(line => {
              const match = line.match(/^([a-zA-Z0-9\-_]+)(.*)$/);
              if (match) {
                const pkg = match[1];
                const versionSpec = match[2].trim();
                deps[pkg] = versionSpec;
              }
            });
            
            let issues = [];
            const promises = Object.keys(deps).map(async (name) => {
              try {
                const latest = await getLatestVersion(name);
                const currentSpec = deps[name];
                let currentVersion = null;
                
                // Extract version from spec: ==X.Y.Z, ~=X.Y.Z, >=X.Y.Z, etc.
                const versionMatch = currentSpec.match(/(?:==|~=|>=|<=|>|<)(\d+\.\d+\.\d+)/);
                if (versionMatch) {
                  currentVersion = versionMatch[1];
                  const currentParts = currentVersion.split('.').map(Number);
                  const latestParts = latest.split('.').map(Number);
                  
                  // Check if major or minor version differs
                  if (latestParts[0] > currentParts[0] || (latestParts[0] === currentParts[0] && latestParts[1] > currentParts[1])) {
                    issues.push(`${name}: ${currentVersion} -> ${latest}`);
                  }
                }
              } catch (e) {
                console.log(`Failed to check ${name}: ${e.message}`);
              }
            });
            
            await Promise.all(promises);
            
            if (issues.length > 0) {
              const title = 'Outdated Dependencies Detected';
              // Check if issue already exists
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['dependencies']
              });
              const alreadyExists = existingIssues.data.some(issue => issue.title === title);
              if (!alreadyExists) {
                const body = `The following dependencies are significantly outdated (major or minor version changes):\n\n${issues.map(i => `- ${i}`).join('\n')}\n\nPlease update requirements.txt accordingly.`;
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['dependencies', 'maintenance']
                });
              }
            }
