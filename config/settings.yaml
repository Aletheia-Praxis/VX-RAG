# VX-RAG Configuration

# Data directories
data_dir: "./data"
raw_data_dir: "./data/raw"
processed_data_dir: "./data/processed"
index_dir: "./data/index"

# Embedding configuration
embedding_model: "..."
embedding_device: "cpu"  # Force CPU usage
embedding_batch_size: 32

# Indexing configuration
chunk_size: 512
chunk_overlap: 50
vector_store: "chromadb"  # Options: chromadb, faiss

# Query configuration
similarity_top_k: 5
query_temperature: 0.1

# MCP configuration
mcp_host: "0.0.0.0"
mcp_port: 5000
mcp_debug: true

# Logging
log_level: "INFO"
log_file: "vx_rag.log"

# Environment variables (set externally)
# LLM_API_KEY: your_llm_api_key
# MCP_API_KEY: your_mcp_api_key
