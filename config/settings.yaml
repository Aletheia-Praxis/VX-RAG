# VX-RAG Configuration

# Data directories
data_dir: "./data"
raw_data_dir: "./data/raw"
processed_data_dir: "./data/processed"
index_dir: "./data/index"
snapshots_dir: "./data/snapshots"

# Embedding configuration
embedding_model: "BAAI/bge-m3"
embedding_provider: "flagembedding"
embedding_device: "cpu"     # Force CPU usage
embedding_batch_size: 10    # Batch size for embedding generation
embedding_cache_size: 100000  # Maximum number of cached embeddings
threads: 12                 # CPU threads for Ryzen optimization
embedding_trust_remote_code: false  # Security: don't trust remote code

# Embedding model dimensions
embedding_dimensions:
  "BAAI/bge-m3": 1024

# Task Queue configuration
task_queue:
  max_concurrent_tasks: 2
  max_completed_tasks: 100
  max_failed_tasks: 50


# Indexing configuration
# Default chunking parameters for general content
chunk_size: 1024
chunk_overlap: 200     # 19.5% overlap - optimal for cybersecurity dense content
vector_store: "qdrant"

# Qdrant Vector Store configuration
qdrant:
  collection_name: "vx_rag_collection"
  path: "./data/index/qdrant"
  distance: "Cosine"
  datatype: "FLOAT16"
  enable_hybrid: true

# Document store configuration
docstore:
  store_type: "duckdb"     # Document store backend: duckdb, simple
  db_name: "docstore.duckdb"  # DuckDB database file name
  table_name: "docstore"   # DuckDB key-value table name
  intermediate_nodes_db_name: "intermediate_nodes.duckdb"
  intermediate_nodes_table_name: "intermediate_nodes"

# Adaptive chunking for technical content
adaptive_chunking:
  enabled: true
  max_chunk_size: 2000  # Maximum chunk size for hierarchical chunker
  
  # Large code blocks (assembly, disassembly, long scripts)
  large_code_blocks:
    chunk_size: 768
    chunk_overlap: 150  # 19.5% overlap maintained
    min_lines: 30       # Trigger when code block has 30+ lines
  
  # Structured tables (IoCs, network traffic, memory dumps)
  tables:
    chunk_size: 512           # Smaller chunks for table rows
    chunk_overlap: 100        # 19.5% overlap maintained
    preserve_integrity: true  # Never split tables
  
  # Short technical snippets (API calls, registry keys, small code samples)
  short_snippets:
    chunk_size: 384    # Smaller chunks for short snippets
    chunk_overlap: 75  # 19.5% overlap maintained
    max_lines: 15      # Trigger when code block has <15 lines
  
  # Hexdumps and memory dumps (very structured content)
  hex_dumps:
    chunk_size: 896     # Slightly smaller for structured hex data
    chunk_overlap: 175  # 19.5% overlap maintained
    preserve_structure: true

# Query configuration
similarity_top_k: 5
query_temperature: 0.1

# Retriever configuration
retriever:
  semantic_top_k: 20    # Number of documents to retrieve semantically
  hybrid_alpha: 0.5     # Weight for hybrid search (0.0 = sparse, 1.0 = dense)
  metadata_filters: []  # List of metadata filters to apply

# Reranker configuration
reranker:
  model_name: "BAAI/bge-reranker-v2-m3"  # Cross-encoder model for reranking
  provider: "flagembedding"              # Reranker provider (FlagEmbedding)
  top_k: 5             # Final number of documents after reranking
  device: "cpu"        # Device for reranking model
  metadata_boost: 0.1  # Boost factor for documents with matching metadata
  enable_metadata_prioritization: true  # Enable metadata-based prioritization

# MCP configuration
mcp:
  host: "127.0.0.1"
  port: 25191  # The MCP server port is 2025, 29th day, 10th month (October), i.e. the date of creation of the repository.
  debug: true  # Enable debug mode
  persist_dir: "data/index"
  
  # Rate limiting
  rate_limit:
    max_concurrent: 2       # Maximum concurrent requests
    queue_size: 10          # Queue size for pending requests
    default_timeout: 600.0  # Default timeout in seconds (10 minutes)
  
  # Tool-specific timeouts
  timeouts:
    query_knowledge_base: 600.0   # 10 minutes for complex queries
    search_documents: 300.0       # 5 minutes for simple searches
    health_check: 30.0            # 30 seconds for health checks
    system_context: 10.0          # 10 seconds for system context
  
  # Tool default parameters
  defaults:
    top_k: 5               # Default number of results for knowledge base queries
    token_budget: 4096     # Default token budget for context assembly
    search_top_k: 10       # Default number of results for document search
    apply_redaction: true  # Enable sensitive data redaction in responses

# Context Assembler configuration
context_assembler:
  token_budget: 4096  # Default token budget for context
  model_name: "gpt-3.5-turbo"  # Model name for token counting
  max_items: null  # Maximum number of context items (null = no limit)
  min_score: null  # Minimum relevance score (null = no limit)

# Router Query Engine configuration
router:
  selector_type: "pydantic"  # Selector type: 'pydantic' or 'llm'
  use_multi_select: false   # Whether to allow multiple tool selection
  verbose: false            # Enable verbose logging for routing decisions

# Duplicate detection configuration
duplicate_detection:
  similarity_threshold: 0.95  # Threshold for near-duplicate detection (0.0-1.0)
  hash_algorithm: "sha256"    # Hash algorithm for content hashing

# Logging configuration
logging:
  log_level: "INFO"
  log_file: "logs/vx_rag.jsonl"
  max_bytes: 10485760  # 10 MB (10 * 1024 * 1024)
  backup_count: 5
  log_format: "json"           # Options: json, text
  log_structured_events: true  # Enable structured logging for key events
  log_metrics: true            # Enable metrics logging

# Metrics
metrics_enabled: true
metrics_log_interval: 300    # Log metrics every 5 minutes (in seconds)
metrics_file: "metrics.log"  # File to log metrics

# Ingestion Pipeline configuration
ingestion:
  default_chunk_size: 1024                # Target token size for general text chunks
  code_chunk_size: 512                    # Target token window for code chunks
  chunk_overlap: 128                      # Tokens to overlap between adjacent chunks
  overlap_ratio_min: 0.10                 # Minimum overlap ratio (10%)
  overlap_ratio_max: 0.15                 # Maximum overlap ratio (15%)
  max_unbroken_string_length: 1000        # Maximum continuous string length before safe splitting
  enable_caching: true                    # Enable pipeline caching
  enable_metadata_extraction: false       # Enable title/metadata extraction
  enable_embedding: true                  # Enable embedding generation
  enable_vector_store: true               # Enable vector store integration
  vector_store_kwargs: {}                 # Additional vector store parameters
