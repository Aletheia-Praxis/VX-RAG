# Docker Compose configuration for VX-RAG

services:
  # Production MCP Server (STDIO mode for IDE integration)
  vx-rag-stdio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vx-rag-stdio
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - vx-rag-internal
    profiles:
      - stdio
    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Development MCP Server (HTTP mode for testing)
  vx-rag-http:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vx-rag-http
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=http
      - MCP_PORT=8000
      - CONFIG_PATH=./config/settings.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - vx-rag-public
    profiles:
      - http
    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Health check: Verify HTTP endpoint is responding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development MCP Server (SSE mode for browser/web clients)
  vx-rag-sse:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vx-rag-sse
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - MCP_TRANSPORT=sse
      - MCP_PORT=8000
      - CONFIG_PATH=./config/settings.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - vx-rag-public
    profiles:
      - sse
    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Health check: Verify SSE endpoint is responding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development shell (for running CLI commands)
  vx-rag-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vx-rag-dev
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./src:/app/src  # Mount source for live editing
    command: /bin/bash
    stdin_open: true
    tty: true
    networks:
      - vx-rag-internal
    profiles:
      - dev
    # Security: Drop unnecessary capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # Named volumes for persistent data
  vx-rag-data:
    driver: local
  vx-rag-logs:
    driver: local

networks:
  # Internal network - no external access (for STDIO/dev)
  vx-rag-internal:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
  
  # Public network - external access allowed (for HTTP/SSE)
  vx-rag-public:
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/16

# Usage examples:
# 
# Build all images:
#   docker compose build
#
# Start MCP server in HTTP mode:
#   docker compose --profile http up
#
# Start MCP server in SSE mode:
#   docker compose --profile sse up
#
# Start development shell:
#   docker compose --profile dev up
#
# Run CLI commands:
#   docker compose --profile dev run --rm vx-rag-dev python -m src.cli ingest
#   docker compose --profile dev run --rm vx-rag-dev python -m src.cli index
#   docker compose --profile dev run --rm vx-rag-dev python -m src.cli query "malware analysis"
#
# Stop all services:
#   docker compose down
#
# Clean up volumes:
#   docker compose down -v
